<%
require "dotenv/load"

server_host = ENV.fetch("KAMAL_SERVER_HOST")
app_host = ENV.fetch("KAMAL_APP_HOST")
app_data_dir = ENV.fetch("KAMAL_APP_DATA_DIR", "zoe_storage")
build_context = ENV["KAMAL_BUILD_CONTEXT"].to_s.strip
chatgpt_oauth_data_dir = ENV.fetch("KAMAL_CHATGPT_OAUTH_DATA_DIR", "zoe_chatgpt_oauth")
codex_version = ENV.fetch("KAMAL_CODEX_VERSION", "0.146.0")
openai_oauth_version = ENV.fetch("KAMAL_OPENAI_OAUTH_VERSION", "2.0.0")
postgres_data_dir = ENV.fetch("KAMAL_POSTGRES_DATA_DIR", "zoe_postgres_data")
postgres_port = ENV["KAMAL_POSTGRES_PORT"].to_s.strip
postgres_port = "127.0.0.1:#{postgres_port}:5432" unless postgres_port.empty? || postgres_port.include?(":")
ssh_port = ENV.fetch("KAMAL_SSH_PORT", "22")
%>

service: zoe-ai
image: anteo/zoe-ai
minimum_version: 2.10.0
deploy_timeout: 60
retain_containers: 2

x-host-docker-internal: &host_docker_internal
  add-host: "host.docker.internal:host-gateway"

proxy:
  app_port: 3000
  host: <%= app_host %>
  ssl: false
  forward_headers: true
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

servers:
  web:
    hosts:
      - <%= server_host %>
    options: *host_docker_internal
    env:
      clear:
        DB_PREPARE: 1
        LOAD_MODELS: 1
  worker:
    hosts:
      - <%= server_host %>
    cmd: bin/docker-entrypoint jobs
    options: *host_docker_internal

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    ACTIVE_STORAGE_SERVICE: local
    DB_POOL: 7
    JOB_CONCURRENCY: 1
    JOB_THREADS: 5
    LOAD_MODELS: 0
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    RAILS_MAX_THREADS: 5
    RAILS_SERVE_STATIC_FILES: true
    WEB_CONCURRENCY: 0
    ZOE_APP__HOST: <%= app_host %>
    ZOE_APP__PORT: 443
    ZOE_APP__PROTOCOL: https
    ZOE_AI__PROVIDERS__CHATGPT__API_BASE: http://zoe-ai-chatgpt-oauth:10531/v1
  secret:
    - DATABASE_URL
    - RAILS_MASTER_KEY
    - ZOE_GOOGLE_CLIENT__ID
    - ZOE_GOOGLE_CLIENT__SECRET

volumes:
  - <%= app_data_dir %>:/rails/storage

accessories:
  chatgpt_oauth:
    service: zoe-ai-chatgpt-oauth
    host: <%= server_host %>
    image: node:22-slim
    # Codex uses its own DNS path and may select an unreachable AAAA record.
    cmd: >-
      sh -lc 'apt-get update -qq;
      apt-get install --no-install-recommends -y ca-certificates > /dev/null;
      rm -rf /var/lib/apt/lists/*;
      set -- $(getent ahostsv4 auth.openai.com | head -n 1);
      printf "%s auth.openai.com\n" "$1" >> /etc/hosts;
      trap "exit 0" TERM INT;
      while true; do
        until [ -s /data/auth.json ]; do
          echo "Waiting for ChatGPT authorization. Run bundle exec kamal chatgpt_login.";
          sleep 10;
        done;
        npx --yes openai-oauth@<%= openai_oauth_version %> --host 0.0.0.0 --port 10531 --oauth-file /data/auth.json --codex-version <%= codex_version %>;
        echo "ChatGPT OAuth proxy stopped; retrying in 10 seconds. Re-run login if authorization expired.";
        sleep 10;
      done'
    directories:
      - <%= chatgpt_oauth_data_dir %>:/data
    env:
      clear:
        CODEX_HOME: /data
        npm_config_cache: /data/npm

  postgres:
    service: zoe-ai-postgres
    host: <%= server_host %>
    image: postgres:17
<% unless postgres_port.empty? %>
    port: <%= postgres_port.inspect %>
<% end %>
    directories:
      - <%= postgres_data_dir %>:/var/lib/postgresql/data
    env:
      clear:
        POSTGRES_DB: zoe_ai_production
        POSTGRES_USER: zoe_ai
      secret:
        - POSTGRES_PASSWORD

asset_path: /rails/public/assets

builder:
  arch: amd64
<% unless build_context.empty? %>
  context: <%= build_context %>
<% end %>

ssh:
  user: deploy
  port: <%= ssh_port %>

aliases:
  chatgpt_auth_status: accessory exec chatgpt_oauth --reuse "npx --yes @openai/codex@<%= codex_version %> login status"
  chatgpt_login: accessory exec chatgpt_oauth -i --reuse "npx --yes @openai/codex@<%= codex_version %> login --device-auth -c cli_auth_credentials_store=file"
  console: app exec -i --reuse "bin/rails console"
  db_console: accessory exec postgres -i "sh -lc 'PGPASSWORD=\"$POSTGRES_PASSWORD\" exec psql -h zoe-ai-postgres -U zoe_ai -d zoe_ai_production'"
  db_dump: accessory exec postgres -q "sh -lc 'PGPASSWORD=\"$POSTGRES_PASSWORD\" exec pg_dump --clean --if-exists --no-owner --no-privileges -h zoe-ai-postgres -U zoe_ai -d zoe_ai_production'"
  logs: app logs -f
  migrate: app exec --primary -i "bin/rails db:migrate"
